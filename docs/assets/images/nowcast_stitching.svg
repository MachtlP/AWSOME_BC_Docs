<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12">
  <rect width="760" height="250" fill="#ffffff"/>
  <text x="20" y="24" font-weight="600" font-size="15">Forcing time series: nowcast from short leads, forecast from the 06Z run</text>
  <!-- time axis -->
  <line x1="80" y1="210" x2="740" y2="210" stroke="#333"/>
  <g fill="#333">
    <text x="80" y="228">day−1 00Z</text><text x="190" y="228">06Z</text><text x="270" y="228">12Z</text><text x="350" y="228">18Z</text>
    <text x="420" y="228">day 00Z</text><text x="500" y="228">06Z (now)</text><text x="640" y="228">+48 h →</text>
  </g>
  <!-- runs -->
  <g font-size="11" fill="#495057">
    <text x="10" y="62">run 00Z</text><text x="10" y="87">run 06Z</text><text x="10" y="112">run 12Z</text>
    <text x="10" y="137">run 18Z</text><text x="10" y="162">run 00Z</text><text x="10" y="187">run 06Z</text>
  </g>
  <!-- each run: light full extent, dark used leads 1-6 -->
  <g>
    <rect x="80" y="52" width="400" height="12" fill="#dee2e6"/><rect x="85" y="52" width="80" height="12" fill="#1f77b4"/>
    <rect x="165" y="77" width="400" height="12" fill="#dee2e6"/><rect x="170" y="77" width="80" height="12" fill="#1f77b4"/>
    <rect x="250" y="102" width="400" height="12" fill="#dee2e6"/><rect x="255" y="102" width="80" height="12" fill="#1f77b4"/>
    <rect x="335" y="127" width="400" height="12" fill="#dee2e6"/><rect x="340" y="127" width="80" height="12" fill="#1f77b4"/>
    <rect x="420" y="152" width="320" height="12" fill="#dee2e6"/><rect x="425" y="152" width="80" height="12" fill="#1f77b4"/>
    <rect x="505" y="177" width="235" height="12" fill="#ff7f0e"/>
  </g>
  <line x1="505" y1="40" x2="505" y2="210" stroke="#d62728" stroke-dasharray="4 3"/>
  <rect x="560" y="44" width="12" height="12" fill="#1f77b4"/><text x="578" y="54">nowcast: leads 1–6 of each run</text>
  <rect x="560" y="64" width="12" height="12" fill="#ff7f0e"/><text x="578" y="74">forecast: 06Z run, leads 1–48</text>
  <rect x="560" y="84" width="12" height="12" fill="#dee2e6"/><text x="578" y="94">not used (fills a missing run)</text>
</svg>
