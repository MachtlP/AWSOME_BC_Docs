<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>How to read the hazard chart</title>
  <rect width="680" height="430" fill="#ffffff"/>

  <!-- plot area: x 80..560 (6 depth breaks, equal spacing = McClung's non-linear scale), y 40..360 (Sk38_CCL 0..1.5) -->
  <!-- zones -->
  <rect x="80" y="40" width="160" height="160" fill="#f3e9fa"/>
  <rect x="240" y="40" width="320" height="160" fill="#ecdcf5"/>
  <rect x="80" y="264" width="480" height="96" fill="#eef1f4"/>

  <!-- grid -->
  <g stroke="#d9d9d9" stroke-width="1">
    <line x1="176" y1="40" x2="176" y2="360"/><line x1="272" y1="40" x2="272" y2="360"/>
    <line x1="368" y1="40" x2="368" y2="360"/><line x1="464" y1="40" x2="464" y2="360"/>
  </g>

  <!-- class limits, in the class colours -->
  <g stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="80" y1="104" x2="560" y2="104" stroke="#3f007d"/>
    <line x1="80" y1="200" x2="560" y2="200" stroke="#b0179a"/>
    <line x1="80" y1="264" x2="560" y2="264" stroke="#3d9be0"/>
  </g>
  <g font-size="10.5" text-anchor="end">
    <text x="556" y="99" fill="#3f007d">Very Poor ≤ 0.3</text>
    <text x="556" y="195" fill="#b0179a">Poor ≤ 0.75</text>
    <text x="556" y="259" fill="#3d9be0">Fair ≤ 1.05</text>
    <text x="556" y="354" fill="#4f6475">Rather Stable</text>
  </g>

  <!-- axes -->
  <g stroke="#333" stroke-width="1.2">
    <line x1="80" y1="40" x2="80" y2="360"/><line x1="80" y1="360" x2="560" y2="360"/>
  </g>
  <g fill="#333" font-size="11" text-anchor="end">
    <text x="74" y="44">0</text><text x="74" y="108">0.3</text><text x="74" y="172">0.6</text>
    <text x="74" y="236">0.9</text><text x="74" y="300">1.2</text><text x="74" y="364">1.5</text>
  </g>
  <g fill="#333" font-size="11" text-anchor="middle">
    <text x="80" y="376">0</text><text x="176" y="376">18</text><text x="272" y="376">35</text>
    <text x="368" y="376">70</text><text x="464" y="376">150</text><text x="560" y="376">300</text>
  </g>
  <text x="320" y="400" text-anchor="middle" fill="#222" font-weight="bold">Depth of the critical layer (cm)  →  destructive size</text>
  <text x="22" y="200" text-anchor="middle" fill="#222" font-weight="bold" transform="rotate(-90 22 200)">Sk38_CCL  →  easier to trigger (likelihood) ↑</text>

  <!-- example clouds -->
  <!-- storm snow: shallow, reactive -->
  <g fill="#ffde00" stroke="#a08a00" stroke-width="0.6">
    <circle cx="120" cy="92" r="4"/><circle cx="132" cy="110" r="4"/><circle cx="108" cy="124" r="4"/>
    <circle cx="146" cy="98" r="4"/><circle cx="125" cy="140" r="4"/><circle cx="150" cy="130" r="4"/>
    <circle cx="112" cy="104" r="4"/><circle cx="138" cy="84" r="4"/><circle cx="160" cy="116" r="4"/>
  </g>
  <!-- persistent layer: deeper, reactive, spread -->
  <g fill="#0078ff" stroke="#00449a" stroke-width="0.6">
    <circle cx="300" cy="80" r="4"/><circle cx="318" cy="96" r="4"/><circle cx="290" cy="112" r="4"/>
    <circle cx="335" cy="88" r="4"/><circle cx="352" cy="120" r="4"/><circle cx="310" cy="134" r="4"/>
    <circle cx="282" cy="150" r="4"/><circle cx="340" cy="160" r="4"/><circle cx="364" cy="102" r="4"/>
    <circle cx="298" cy="176" r="4"/><circle cx="326" cy="188" r="4"/><circle cx="372" cy="140" r="4"/>
    <circle cx="306" cy="222" r="4"/><circle cx="348" cy="246" r="4"/><circle cx="292" cy="280" r="4"/>
  </g>
  <!-- median diamond -->
  <polygon points="322,128 331,137 322,146 313,137" fill="#2e7d32" stroke="#0b3d0e" stroke-width="1"/>

  <!-- callouts -->
  <g font-size="11" fill="#222">
    <text x="88" y="56" font-weight="bold">Shallow and reactive</text>
    <text x="88" y="70">small avalanches, e.g. storm snow</text>
    <text x="400" y="56" font-weight="bold">Deep and reactive</text>
    <text x="400" y="70">large avalanches: most severe</text>
    <text x="250" y="300" font-weight="bold">Stable: hard to trigger</text>
    <text x="250" y="314">whatever the depth</text>
  </g>
  <g font-size="10.5" fill="#2e7d32">
    <line x1="333" y1="137" x2="392" y2="137" stroke="#2e7d32" stroke-width="1"/>
    <text x="396" y="134">◆ median of the shown points</text>
    <text x="396" y="147">at the current time step</text>
  </g>

  <!-- legend: what one dot is -->
  <g font-size="10.5" fill="#444">
    <circle cx="580" cy="60" r="4" fill="#0078ff" stroke="#00449a" stroke-width="0.6"/>
    <text x="590" y="64">one point</text>
    <text x="580" y="80">(band, cell or</text>
    <text x="580" y="93">station slope)</text>
    <text x="580" y="116">colour = grain</text>
    <text x="580" y="129">type of the</text>
    <text x="580" y="142">critical layer</text>
    <circle cx="584" cy="160" r="4" fill="#ffde00" stroke="#a08a00" stroke-width="0.6"/><text x="592" y="164">PP</text>
    <circle cx="584" cy="176" r="4" fill="#b2edff" stroke="#5a9bb0" stroke-width="0.6"/><text x="592" y="180">FC</text>
    <circle cx="584" cy="192" r="4" fill="#0078ff" stroke="#00449a" stroke-width="0.6"/><text x="592" y="196">DH</text>
    <circle cx="584" cy="208" r="4" fill="#ff0000" stroke="#990000" stroke-width="0.6"/><text x="592" y="212">SH</text>
    <text x="580" y="240">tight cloud =</text>
    <text x="580" y="253">widespread,</text>
    <text x="580" y="266">consistent</text>
    <text x="580" y="286">wide spread =</text>
    <text x="580" y="299">variable,</text>
    <text x="580" y="312">patchy</text>
  </g>
</svg>
